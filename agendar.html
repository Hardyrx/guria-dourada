<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendar | Guria Dourada Beauty Clinic</title>
<meta name="theme-color" content="#1E1712">
<meta name="description" content="Agende seu horário na Guria Dourada Beauty Clinic. Escolha o serviço, a profissional e o melhor horário em poucos toques.">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{
  --espresso:#1E1712; --espresso-2:#2B211A; --ivory:#FBF7F0; --card:#FFFFFF; --sand:#F3ECE1;
  --ink:#231B15; --muted:#8B7C6B; --line:#EAE1D4;
  --gold:#B8913F; --gold-deep:#8C6A22; --gold-soft:#F4EAD6; --champagne:#E3C886;
  --erro:#B3261E; --ok:#3F8C6C;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Manrope","Segoe UI",system-ui,sans-serif;
  --r:16px; --sombra:0 1px 2px rgba(35,27,21,.04),0 10px 30px rgba(140,106,34,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Topo */
.hero{background:var(--espresso);color:#EFE6D8;text-align:center;padding:34px 20px 70px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 320px at 50% -20%,rgba(227,200,134,.18),transparent 70%)}
.hero>*{position:relative}
.hero img{width:190px;max-width:62%;height:auto;display:block;margin:0 auto 14px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:.3px;color:#F5ECDC}
.hero h1 em{color:var(--champagne)}
.hero p{font-size:13.5px;color:#B9A98F;margin-top:6px}
.info{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.hero{transition:padding .3s}
body.compacto .hero{padding:18px 20px 56px}
body.compacto .hero h1,body.compacto .hero p,body.compacto .info{display:none}
body.compacto .hero img{width:130px;margin-bottom:0}
.info span{font-size:12px;border:1px solid rgba(227,200,134,.28);color:#D9C9A8;border-radius:99px;padding:5px 12px}

/* Conteúdo */
.wrap{max-width:620px;margin:-44px auto 0;padding:0 16px 150px;position:relative}
.painel{background:var(--card);border-radius:22px;box-shadow:var(--sombra);padding:22px 18px 24px;min-height:300px}
.topo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.voltar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:18px;color:var(--muted);flex-shrink:0}
.voltar:hover{border-color:var(--gold);color:var(--gold-deep)}
.passo{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold-deep);font-weight:700}
.trilho{height:3px;background:var(--sand);border-radius:3px;margin:12px 0 18px;overflow:hidden}
.trilho i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--champagne));border-radius:3px;transition:width .4s ease}
h2{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.15;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}

/* Busca e categorias */
.busca{position:relative;margin-bottom:12px}
.busca input{width:100%;border:1px solid var(--line);background:var(--ivory);border-radius:12px;padding:12px 14px 12px 40px;font-size:15px}
.busca input:focus{outline:none;border-color:var(--gold);background:#fff}
.busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.cat.on{background:var(--espresso);border-color:var(--espresso);color:#F5ECDC}
.grupo{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 2px 8px}
.grupo:first-child{margin-top:4px}

/* Serviços */
.serv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px;background:#fff;transition:border-color .2s,background .2s,transform .1s}
.serv:active{transform:scale(.99)}
.serv:hover{border-color:#D8C49A}
.serv.on{border-color:var(--gold);background:var(--gold-soft)}
.serv .txt{flex:1;min-width:0}
.serv b{display:block;font-weight:600;font-size:14.5px;line-height:1.35}
.serv small{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-top:3px;flex-wrap:wrap}
.serv .preco{color:var(--gold-deep);font-weight:700}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);border-radius:6px;padding:2px 7px}
.serv.on .tag{background:#fff}
.mais{width:30px;height:30px;border-radius:50%;border:1.5px solid #D8C49A;display:grid;place-items:center;flex-shrink:0;color:var(--gold-deep);font-size:18px;line-height:1;transition:.2s}
.serv.on .mais{background:var(--gold);border-color:var(--gold);color:#fff}
.vazio{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}

/* Profissionais */
.profs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prof{border:1px solid var(--line);border-radius:var(--r);padding:18px 10px 16px;text-align:center;background:#fff;transition:.2s}
.prof:hover{border-color:#D8C49A}
.prof.on{border-color:var(--gold);background:var(--gold-soft)}
.av{width:58px;height:58px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-family:var(--serif);font-size:26px;font-weight:600;color:#fff}
.prof b{display:block;font-size:15px}
.prof small{color:var(--muted);font-size:12.5px}
.prof.qualquer{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-align:left;padding:16px}
.prof.qualquer .av{margin:0;width:48px;height:48px;font-size:22px;background:linear-gradient(135deg,var(--champagne),var(--gold))}

/* Dias e horários */
.dias{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 6px;padding:4px 18px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:0 0 62px;scroll-snap-align:start;border:1px solid var(--line);border-radius:14px;padding:10px 0 9px;text-align:center;background:#fff;transition:.2s}
.dia span{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
.dia b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1;font-weight:600}
.dia small{display:block;font-size:11px;color:var(--muted)}
.dia.on{background:var(--espresso);border-color:var(--espresso)}
.dia.on span,.dia.on small{color:#C9B894}.dia.on b{color:#F5ECDC}
.dia:disabled{opacity:.35;cursor:default}
.mes{font-size:13px;color:var(--muted);margin:2px 0 8px;font-weight:600}
.periodo{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.periodo::after{content:"";flex:1;height:1px;background:var(--line)}
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hora{border:1px solid var(--line);border-radius:12px;padding:11px 0;font-weight:600;font-size:14.5px;background:#fff;transition:.15s}
.hora:hover{border-color:var(--gold)}
.hora.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* Formulário e resumo */
.resumo{background:var(--sand);border-radius:var(--r);padding:16px;margin-bottom:18px}
.linha{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:14px}
.linha span:first-child{color:var(--muted)}
.linha span:last-child{text-align:right;font-weight:600}
.linha.total{border-top:1px solid #E2D6C3;margin-top:6px;padding-top:12px;font-size:15.5px}
.linha.total span:last-child{color:var(--gold-deep)}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.campo label i{font-style:normal;color:var(--muted);font-weight:500}
.campo input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;background:#fff}
.campo input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,145,63,.15)}
.nota{font-size:13px;color:var(--muted);background:var(--gold-soft);border-radius:12px;padding:12px 14px;line-height:1.55}
.erro{color:var(--erro);font-size:13.5px;margin-top:12px;min-height:1em}

/* Barra fixa */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .3s ease}
.barra.on{transform:none}
.barra .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:14px}
.barra .res{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.barra .res b{display:block;color:var(--ink);font-size:16px}
.btn{background:linear-gradient(180deg,#C49B48,#9E7A2E);color:#fff;font-weight:700;border-radius:14px;padding:14px 22px;font-size:15px;box-shadow:0 6px 18px rgba(158,122,46,.28);transition:.2s;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn.claro{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}

/* Sucesso */
.ok{text-align:center;padding:16px 4px 4px}
.selo{width:76px;height:76px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--champagne),var(--gold));color:#fff;font-size:34px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.ok p{color:var(--muted);margin:8px 0 18px}
.cod{display:inline-block;font-weight:700;letter-spacing:2px;border:1px dashed var(--gold);color:var(--gold-deep);border-radius:10px;padding:8px 16px;margin-bottom:20px}
.acoes{display:grid;gap:10px}
.acoes .btn{display:block;text-decoration:none;text-align:center}

/* Carregando */
.esqueleto{height:64px;border-radius:var(--r);margin-bottom:8px;background:linear-gradient(90deg,var(--sand),#FAF6EF,var(--sand));background-size:200% 100%;animation:brilho 1.2s infinite}
@keyframes brilho{to{background-position:-200% 0}}

footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 16px 0}

.entra{animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.painel{padding:30px 30px 32px}.cats,.dias{margin-left:-30px;margin-right:-30px;padding-left:30px;padding-right:30px}.profs{grid-template-columns:1fr 1fr 1fr}.horas{grid-template-columns:repeat(5,1fr)}}
</style>
</head>

<script>
const URL_SB = 'https://tfoazcjbnubedrwndqtc.supabase.co';
const KEY_SB = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmb2F6Y2pibnViZWRyd25kcXRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjA4MjMsImV4cCI6MjEwNTU5NjgyM30.B_00xsYqcW5r27Uo5ZpUec3Mb6ZVCnNztvsGOBLzW20';

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoje = () => iso(new Date());
const addDias = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const toMin = h => { const [a, b] = String(h).split(':').map(Number); return a * 60 + b; };
const toHM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const brl = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dur = m => m < 60 ? `${m} min` : m % 60 ? `${Math.floor(m / 60)}h${pad(m % 60)}` : `${m / 60}h`;
const SEM = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const SEM_LONGO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MES_LONGO = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const DIAS_AGENDA = 60;

/* Nome do serviço padronizado: sem emoji, sem caixa alta, "Pacote" vira etiqueta */
const MINUSC = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'com', 'sem', 'para', 'a', 'o', 'em']);
function limparNome(nome) {
  let s = String(nome).replace(/\p{Extended_Pictographic}|️/gu, '').replace(/\s*\/\s*/g, ' / ')
    .replace(/\(\s*/g, '(').replace(/\s*\)/g, ')').replace(/\s*-\s*/g, ' · ').replace(/\s+/g, ' ').trim();
  const pacote = /pacote/i.test(s);
  s = s.replace(/\s*·?\s*pacote\s*$/i, '').replace(/^\s*pacote\s*·?\s*/i, '');
  s = s.toLowerCase().split(' ').map((w, i) => (i && MINUSC.has(w)) ? w : w.replace(/^(\(?)(\p{L})/u, (m, p, l) => p + l.toUpperCase())).join(' ');
  return { nome: s.replace(/\s*·\s*$/, ''), pacote };
}
function categoria(nome) {
  const n = nome.toLowerCase();
  if (/mega ?hair/.test(n)) return 'Mega Hair';
  if (/corte/.test(n)) return 'Cortes';
  if (/escova/.test(n)) return 'Escovas';
  if (/progressiv|alisa|botox/.test(n)) return 'Progressiva e Botox';
  if (/colora|mecha|luzes|balayage|tint/.test(n)) return 'Coloração';
  if (/bronze|drenagem|massag|depila/.test(n)) return 'Corpo e Bronze';
  if (/manicure|pedicure|unha/.test(n)) return 'Unhas';
  if (/sobrancelha|c[ií]lio/.test(n)) return 'Sobrancelha e Cílios';
  return 'Tratamentos Capilares';
}
const ORDEM_CATS = ['Escovas', 'Cortes', 'Tratamentos Capilares', 'Progressiva e Botox', 'Coloração', 'Mega Hair', 'Corpo e Bronze', 'Unhas', 'Sobrancelha e Cílios'];

/* ============ Estado ============ */
let sb, cfg = {}, profs = [], servicos = [], ocupados = [];
const sel = { servs: [], prof: null, data: null, hora: null };
const form = { nome: '', tel: '', niver: '' };
let passo = 1, catAtiva = 'Todos', busca = '';
const app = $('#app'), barra = $('#barra');

/* ============ Dados ============ */
async function iniciar() {
  if (!window.supabase) return falha('Não conseguimos carregar a página. Confira a internet e recarregue.');
  sb = window.supabase.createClient(URL_SB, KEY_SB, { auth: { persistSession: false } });
  const { data, error } = await sb.rpc('agenda_publica');
  if (error || !data) return falha('Não conseguimos conectar à agenda. Confira a internet e recarregue a página.');
  cfg = data.config || {};
  profs = (data.profs || []).sort((a, b) => (a.cadeira || 0) - (b.cadeira || 0));
  const JOIAS = ['#B8913F', '#4C6FB5', '#3F8C6C', '#C0785A', '#8A66C2', '#3F93A8'], usadas = new Set();
  profs.forEach((p, i) => { const c = String(p.cor || '').toLowerCase(); p.cor = c && !usadas.has(c) ? c : JOIAS.find(j => !usadas.has(j.toLowerCase())) || JOIAS[i % JOIAS.length]; usadas.add(p.cor.toLowerCase()); });
  ocupados = data.ocupados || [];
  const vistos = new Set();
  servicos = (data.servicos || []).map(s => {
    const l = limparNome(s.nome);
    return { id: s.id, nome: l.nome, pacote: l.pacote, preco: +s.preco || 0, dur: +s.dur || 60, cat: s.cat || categoria(s.nome) };
  }).filter(s => { const k = s.nome.toLowerCase() + '|' + s.preco; if (vistos.has(k)) return false; vistos.add(k); return true; })
    .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  $('#info').innerHTML = [cfg.abre && cfg.fecha ? `Das ${cfg.abre.replace(':00', 'h')} às ${cfg.fecha.replace(':00', 'h')}` : '', `${profs.length} profissionais`, 'Confirmação pelo WhatsApp']
    .filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('');
  if (!servicos.length || !profs.length) return falha('Estamos atualizando nossa agenda. Volte em instantes.');
  render();
}
function falha(msg) { app.innerHTML = `<div class="vazio">${esc(msg)}<br><br><button class="btn claro" onclick="location.reload()">Recarregar</button></div>`; barra.classList.remove('on'); }

const durTotal = () => sel.servs.reduce((t, s) => t + s.dur, 0) || 60;
const precoTotal = () => sel.servs.reduce((t, s) => t + s.preco, 0);
const temAvaliacao = () => sel.servs.some(s => !s.preco);
const fechado = data => (cfg.fechado || []).includes(new Date(data + 'T12:00').getDay());

function livres(data, profId, d) {
  if (!cfg.abre || !cfg.fecha || fechado(data)) return [];
  const ini = toMin(cfg.abre), fim = toMin(cfg.fecha), p = +(cfg.intervalo || 30);
  const agora = new Date(), minAgora = data === hoje() ? agora.getHours() * 60 + agora.getMinutes() + 30 : -1;
  const oc = ocupados.filter(a => a.data === data && a.prof === profId);
  const out = [];
  for (let m = ini; m + d <= fim; m += p) {
    if (m <= minAgora) continue;
    if (!oc.some(a => m < toMin(a.hora) + (+a.dur || 60) && toMin(a.hora) < m + d)) out.push(m);
  }
  return out;
}
function horariosDoDia(data) {
  const d = durTotal(), ids = sel.prof ? [sel.prof.id] : profs.map(p => p.id), todos = new Set();
  ids.forEach(id => livres(data, id, d).forEach(m => todos.add(m)));
  return [...todos].sort((a, b) => a - b);
}

/* ============ Telas ============ */
const NOMES = ['Serviços', 'Profissional', 'Data e horário', 'Seus dados'];
function cabecalho(titulo, sub) {
  return `<div class="topo">${passo > 1 ? '<button class="voltar" id="voltar" aria-label="Voltar">‹</button>' : ''}
    <div class="passo">Passo ${passo} de 4 · ${NOMES[passo - 1]}</div></div>
    <div class="trilho"><i style="width:${passo * 25}%"></i></div><h2>${titulo}</h2><p class="sub">${sub}</p>`;
}
function render() {
  document.body.classList.toggle('compacto', passo > 1);
  ({ 1: telaServicos, 2: telaProf, 3: telaData, 4: telaDados })[passo]();
  app.classList.remove('entra'); void app.offsetWidth; app.classList.add('entra');
  const v = $('#voltar'); if (v) v.onclick = () => ir(passo - 1);
  atualizarBarra();
}
function ir(p) { passo = p; render(); window.scrollTo({ top: Math.max(0, app.offsetTop - 20), behavior: 'smooth' }); }

function telaServicos() {
  const cats = ORDEM_CATS.filter(c => servicos.some(s => s.cat === c)).concat([...new Set(servicos.map(s => s.cat))].filter(c => !ORDEM_CATS.includes(c)));
  const q = busca.trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const lista = servicos.filter(s => (catAtiva === 'Todos' || s.cat === catAtiva) && (!q || s.nome.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').includes(q)));
  const card = s => { const on = sel.servs.some(x => x.id === s.id);
    return `<button class="serv ${on ? 'on' : ''}" data-s="${s.id}" aria-pressed="${on}"><div class="txt"><b>${esc(s.nome)}</b>
      <small>${s.preco ? `<span class="preco">${brl(s.preco)}</span>` : '<span class="preco">Sob avaliação</span>'}<span>· ${dur(s.dur)}</span>${s.pacote ? '<span class="tag">Pacote</span>' : ''}</small></div>
      <span class="mais">${on ? '✓' : '+'}</span></button>`; };
  let corpo;
  if (!lista.length) corpo = '<div class="vazio">Nenhum serviço encontrado.</div>';
  else if (catAtiva === 'Todos' && !q) corpo = cats.map(c => `<div class="grupo">${esc(c)}</div>` + lista.filter(s => s.cat === c).map(card).join('')).join('');
  else corpo = lista.map(card).join('');
  app.innerHTML = cabecalho('O que vamos fazer hoje?', 'Escolha um ou mais serviços.') +
    `<div class="busca"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
     <input id="busca" type="search" placeholder="Buscar serviço" value="${esc(busca)}" autocomplete="off"></div>
     <div class="cats">${['Todos', ...cats].map(c => `<button class="cat ${c === catAtiva ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
     <div id="lista">${corpo}</div>`;
  const inp = $('#busca');
  inp.oninput = () => { busca = inp.value; const pos = inp.selectionStart; telaServicos(); atualizarBarra(); const n = $('#busca'); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll('.cat').forEach(b => b.onclick = () => { catAtiva = b.dataset.c; telaServicos(); atualizarBarra(); app.querySelector('.cat.on')?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); });
  app.querySelectorAll('.serv').forEach(b => b.onclick = () => {
    const s = servicos.find(x => x.id === b.dataset.s), i = sel.servs.findIndex(x => x.id === s.id);
    if (i >= 0) sel.servs.splice(i, 1); else sel.servs.push(s);
    sel.data = sel.hora = null;
    const on = i < 0; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.querySelector('.mais').textContent = on ? '✓' : '+';
    atualizarBarra();
  });
}

function telaProf() {
  const ini = n => esc(String(n).trim().charAt(0).toUpperCase());
  app.innerHTML = cabecalho('Com quem você prefere?', 'Escolha sua profissional ou deixe a gente encaixar no melhor horário.') +
    `<div class="profs"><button class="prof qualquer ${!sel.prof ? 'on' : ''}" data-p=""><span class="av">✦</span><span><b>Primeira disponível</b><small>Mais opções de horário</small></span></button>
    ${profs.map(p => `<button class="prof ${sel.prof?.id === p.id ? 'on' : ''}" data-p="${p.id}"><span class="av" style="background:${esc(p.cor || '#B8913F')}">${ini(p.nome)}</span><b>${esc(p.nome)}</b><small>Profissional</small></button>`).join('')}</div>`;
  app.querySelectorAll('.prof').forEach(b => b.onclick = () => {
    sel.prof = b.dataset.p ? profs.find(p => p.id === b.dataset.p) : null; sel.data = sel.hora = null;
    app.querySelectorAll('.prof').forEach(x => x.classList.toggle('on', x === b));
    atualizarBarra();
  });
}

function telaData() {
  const dias = []; for (let i = 0; i <= DIAS_AGENDA; i++) { const d = addDias(hoje(), i); dias.push({ d, n: horariosDoDia(d).length }); }
  if (!sel.data || !dias.find(x => x.d === sel.data && x.n)) { sel.data = dias.find(x => x.n)?.d || null; sel.hora = null; }
  const dt = sel.data ? new Date(sel.data + 'T12:00') : null;
  const hs = sel.data ? horariosDoDia(sel.data) : [];
  const grupos = [['Manhã', m => m < 720], ['Tarde', m => m >= 720 && m < 1080], ['Noite', m => m >= 1080]];
  const blocos = grupos.map(([nome, f]) => { const l = hs.filter(f); return l.length ? `<div class="periodo">${nome}</div><div class="horas">${l.map(m => `<button class="hora ${toHM(m) === sel.hora ? 'on' : ''}" data-h="${toHM(m)}">${toHM(m)}</button>`).join('')}</div>` : ''; }).join('');
  app.innerHTML = cabecalho('Quando fica melhor?', `${dur(durTotal())} de atendimento${sel.prof ? ' com ' + esc(sel.prof.nome) : ''}.`) +
    (sel.data ? `<div class="mes" id="mes">${MES_LONGO[dt.getMonth()]} ${dt.getFullYear()}</div>
    <div class="dias" id="dias">${dias.map(x => { const d = new Date(x.d + 'T12:00');
      return `<button class="dia ${x.d === sel.data ? 'on' : ''}" data-d="${x.d}" ${x.n ? '' : 'disabled'}><span>${x.d === hoje() ? 'Hoje' : SEM[d.getDay()]}</span><b>${d.getDate()}</b><small>${MES[d.getMonth()]}</small></button>`; }).join('')}</div>
    ${blocos || '<div class="vazio">Sem horários neste dia.</div>'}`
    : '<div class="vazio">Não há horários livres nos próximos dias para essa combinação. Tente outra profissional ou menos serviços.</div>');
  const on = app.querySelector('.dia.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  app.querySelectorAll('.dia').forEach(b => b.onclick = () => { sel.data = b.dataset.d; sel.hora = null; const y = window.scrollY; telaData(); atualizarBarra(); window.scrollTo(0, y); });
  app.querySelectorAll('.hora').forEach(b => b.onclick = () => { sel.hora = b.dataset.h; app.querySelectorAll('.hora').forEach(x => x.classList.toggle('on', x === b)); atualizarBarra(); });
}

function quando() { const d = new Date(sel.data + 'T12:00'); return `${SEM_LONGO[d.getDay()]}, ${d.getDate()} de ${MES_LONGO[d.getMonth()].toLowerCase()} · ${sel.hora}`; }
function totalTxt() { return precoTotal() ? brl(precoTotal()) + (temAvaliacao() ? ' + avaliação' : '') : 'Sob avaliação'; }
function mascaraTel(v) { const d = v.replace(/\D/g, '').slice(0, 11); if (d.length <= 2) return d.length ? `(${d}` : ''; if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`; if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; }

function telaDados() {
  app.innerHTML = cabecalho('Quase lá', 'Confira o resumo e deixe seu contato para confirmarmos.') +
    `<div class="resumo">${sel.servs.map(s => `<div class="linha"><span>${esc(s.nome)}</span><span>${s.preco ? brl(s.preco) : 'Avaliação'}</span></div>`).join('')}
      <div class="linha"><span>Profissional</span><span>${esc(sel.prof?.nome || 'Primeira disponível')}</span></div>
      <div class="linha"><span>Quando</span><span>${quando()}</span></div>
      <div class="linha"><span>Duração</span><span>${dur(durTotal())}</span></div>
      <div class="linha total"><span>Total</span><span>${totalTxt()}</span></div></div>
    <div class="campo"><label for="fNome">Nome completo</label><input id="fNome" value="${esc(form.nome)}" placeholder="Maria da Silva" autocomplete="name"></div>
    <div class="campo"><label for="fTel">WhatsApp</label><input id="fTel" value="${esc(form.tel)}" placeholder="(51) 99999-9999" type="tel" inputmode="numeric" autocomplete="tel-national"></div>
    <div class="campo"><label for="fNiver">Aniversário <i>(opcional, tem mimo no seu dia)</i></label><input id="fNiver" value="${esc(form.niver)}" type="date"></div>
    <p class="nota">Seu pedido chega para nossa equipe e confirmamos pelo WhatsApp. O horário fica reservado após a confirmação.</p>
    <div class="erro" id="err"></div>`;
  const n = $('#fNome'), t = $('#fTel'), b = $('#fNiver');
  n.oninput = () => { form.nome = n.value; atualizarBarra(); };
  t.oninput = () => { t.value = mascaraTel(t.value); form.tel = t.value; atualizarBarra(); };
  b.oninput = () => { form.niver = b.value; };
}

/* ============ Barra fixa ============ */
function podeAvancar() {
  if (passo === 1) return sel.servs.length > 0;
  if (passo === 2) return true;
  if (passo === 3) return !!(sel.data && sel.hora);
  return form.nome.trim().length >= 2 && form.tel.replace(/\D/g, '').length >= 10;
}
function atualizarBarra() {
  const n = sel.servs.length;
  barra.classList.toggle('on', n > 0);
  $('#barraRes').innerHTML = n ? `<b>${totalTxt()}</b>${n} serviço${n > 1 ? 's' : ''} · ${dur(durTotal())}${passo >= 3 && sel.hora ? ' · ' + sel.data.slice(8) + '/' + sel.data.slice(5, 7) + ' ' + sel.hora : ''}` : '';
  const btn = $('#barraBtn');
  btn.textContent = passo === 4 ? 'Enviar pedido' : 'Continuar';
  btn.disabled = !podeAvancar();
}
$('#barraBtn').onclick = () => { if (!podeAvancar()) return; if (passo < 4) ir(passo + 1); else enviar(); };

/* ============ Envio ============ */
async function enviar() {
  const btn = $('#barraBtn'), err = $('#err');
  btn.disabled = true; btn.textContent = 'Enviando...'; err.textContent = '';
  const { data: agId, error } = await sb.rpc('solicitar_agendamento', {
    p_nome: form.nome.trim(), p_tel: form.tel.trim(), p_niver: form.niver || '', p_data: sel.data, p_hora: sel.hora,
    p_prof: sel.prof?.id || null, p_servs: sel.servs.map(s => s.id)
  });
  if (error) {
    err.textContent = error.message && !/fetch|network/i.test(error.message) ? error.message : 'Não conseguimos enviar. Confira a internet e tente de novo.';
    if (/preenchido/.test(error.message || '')) { const r = await sb.rpc('agenda_publica'); if (r.data) ocupados = r.data.ocupados || []; }
    atualizarBarra(); return;
  }
  sucesso(agId);
}
function linkAgenda() {
  const ini = sel.data.replace(/-/g, '') + 'T' + sel.hora.replace(':', '') + '00';
  const f = toMin(sel.hora) + durTotal(), fim = sel.data.replace(/-/g, '') + 'T' + toHM(f).replace(':', '') + '00';
  const p = new URLSearchParams({ action: 'TEMPLATE', text: 'Guria Dourada Beauty Clinic', dates: `${ini}/${fim}`, ctz: 'America/Sao_Paulo',
    details: 'Pedido de horário: ' + sel.servs.map(s => s.nome).join(', ') + '. Aguardando confirmação pelo WhatsApp.' });
  return 'https://calendar.google.com/calendar/render?' + p;
}
function sucesso(agId) {
  barra.classList.remove('on');
  app.innerHTML = `<div class="ok entra"><div class="selo">✓</div><h2>Pedido enviado!</h2>
    <p>Recebemos seu pedido para <b>${quando()}</b>.<br>Vamos confirmar pelo WhatsApp <b>${esc(form.tel)}</b> em breve.</p>
    <div class="cod">GD-${esc(String(agId || '').toUpperCase().slice(0, 6))}</div>
    <div class="acoes"><a class="btn" href="${linkAgenda()}" target="_blank" rel="noopener">Salvar na minha agenda</a>
    <button class="btn claro" onclick="location.reload()">Fazer outro pedido</button></div></div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

iniciar();
</script>
</body>
</html>
