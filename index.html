<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendar | Guria Dourada Beauty Clinic</title>
<meta name="theme-color" content="#22150D">
<meta name="description" content="Agende seu horário na Guria Dourada Beauty Clinic. Escolha o serviço, a profissional e o melhor horário em poucos toques.">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --faint:#86868B;
  --hair:rgba(0,0,0,.09); --fill:#EDEDF0; --black:#2A1A10;
  --gold:#A9802F; --gold-light:#E3C886; --erro:#D70015;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.25,.1,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.47;letter-spacing:-.022em;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:10px}

/* Topo: a logo como peça em vitrine */
.hero{background:radial-gradient(120% 70% at 50% 0%,#3A2416 0%,#22150D 48%,#160D07 100%);color:#F5F5F7;text-align:center;position:relative;overflow:hidden;min-height:min(86svh,820px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px 72px;transition:min-height .5s var(--ease),padding .5s var(--ease)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(46% 58% at 50% -6%,rgba(255,226,170,.22),rgba(255,226,170,.06) 45%,transparent 72%);animation:luz 2.2s var(--ease) both}
@keyframes luz{from{opacity:0}}
.hero>*{position:relative}
.palco{position:relative;width:min(340px,78vw);margin-bottom:42px;will-change:transform,opacity}
.palco::before{content:"";position:absolute;left:50%;top:46%;width:150%;height:120%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(201,162,74,.22),transparent);filter:blur(10px);animation:luz 2.6s var(--ease) .3s both}
.palco::after{content:"";position:absolute;left:12%;right:12%;bottom:-26px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(227,200,134,.38),transparent);filter:blur(6px);animation:luz 2s var(--ease) 1s both}
.marca{position:relative;animation:surge 1.4s var(--ease) .15s both}
.marca img{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.marca::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 42%,rgba(255,250,232,.95) 50%,transparent 58%);background-size:300% 100%;background-position:180% 0;
  -webkit-mask:url(logo.png) center/contain no-repeat;mask:url(logo.png) center/contain no-repeat;mix-blend-mode:screen;animation:reflexo 1.8s var(--ease) 1.2s forwards,reflexo2 1.8s var(--ease) 9s infinite}
@keyframes reflexo{to{background-position:-80% 0}}
@keyframes reflexo2{0%{background-position:180% 0}30%,100%{background-position:-80% 0}}
@keyframes surge{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.hero h1{font-size:44px;line-height:1.05;font-weight:600;letter-spacing:-.035em;max-width:12ch;
  background:linear-gradient(180deg,#FFFFFF 0%,#F4E7C8 55%,#C9A24A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:surge 1.1s var(--ease) .7s both}
.hero p{font-size:19px;line-height:1.42;color:#BBA98F;margin:14px auto 0;max-width:28ch;animation:surge 1.1s var(--ease) .85s both}
.ctas{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:30px;animation:surge 1.1s var(--ease) 1s both}
.btn.ouro{background:linear-gradient(180deg,#E2C178,#B38A3A);color:#1D1D1F;font-weight:600;padding:14px 30px;box-shadow:0 0 0 1px rgba(255,236,190,.25) inset,0 10px 30px rgba(201,162,74,.25)}
.btn.ouro:hover{background:linear-gradient(180deg,#EACB86,#BD9443)}
.hero .horario{font-size:14px;color:#9C8A70}
body.compacto .hero{min-height:0;padding:18px 24px 16px}
body.compacto .hero h1,body.compacto .hero p,body.compacto .ctas,body.compacto .palco::after{display:none}
body.compacto .palco{width:116px;margin-bottom:0;transform:none!important;opacity:1!important}

/* Página */
.wrap{max-width:640px;margin:0 auto;padding:34px 20px 160px}
.topo{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin-bottom:8px}
.voltar{display:flex;align-items:center;gap:4px;color:var(--gold);font-size:17px;padding:4px 0}
.voltar svg{margin-left:-4px}
.passo{font-size:14px;color:var(--faint)}
.trilho{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 26px}
.trilho i{height:3px;border-radius:2px;background:#D9D9DE;overflow:hidden;position:relative}
.trilho i::after{content:"";position:absolute;inset:0;background:var(--black);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.trilho i.on::after{transform:none}
h2{font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:17px;margin:6px 0 24px}

/* Busca e filtros */
.busca{position:relative;margin-bottom:14px}
.busca input{width:100%;border:0;background:var(--fill);border-radius:12px;padding:11px 14px 11px 38px;font-size:17px}
.busca input::placeholder{color:var(--faint)}
.busca input:focus{outline:none;background:#E5E5EA}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.filtros{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 8px;padding:2px 20px 6px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtro{white-space:nowrap;border-radius:99px;padding:7px 15px;font-size:15px;font-weight:500;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair);transition:background .25s var(--ease),color .25s var(--ease)}
.filtro.on{background:var(--black);color:#fff;box-shadow:none}

/* Listas agrupadas (estilo iOS) */
.titulo-grupo{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:30px 4px 10px}
.titulo-grupo:first-child{margin-top:14px}
.lista{background:var(--card);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;position:relative;transition:background .2s var(--ease)}
.item+.item::before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:var(--hair)}
.item:active{background:#F2F2F4}
.item .txt{flex:1;min-width:0}
.item b{display:block;font-weight:500;font-size:17px;line-height:1.3}
.item .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;color:var(--muted);margin-top:3px}
.item .preco{color:var(--ink)}
.item .pacote{color:var(--gold);font-weight:600}
.check{width:22px;height:22px;flex-shrink:0;color:var(--gold);opacity:0;transform:scale(.6);transition:opacity .25s var(--ease),transform .35s cubic-bezier(.34,1.56,.64,1)}
.item.on .check{opacity:1;transform:none}
.item.on b{font-weight:600}
.vazio{text-align:center;color:var(--muted);padding:36px 12px;font-size:16px}
.item .desc{font-size:15px;color:var(--muted)}

/* Dias e horários */
.mes{font-size:15px;font-weight:600;color:var(--muted);margin:0 2px 10px}
.dias{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 12px;scroll-snap-type:x proximity;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:0 0 64px;scroll-snap-align:start;border-radius:16px;padding:11px 0 10px;text-align:center;background:#fff;transition:background .25s var(--ease),color .25s var(--ease)}
.dia span{display:block;font-size:13px;color:var(--muted)}
.dia b{display:block;font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
.dia.on{background:var(--black);color:#fff}
.dia.on span{color:#A1A1A6}
.dia:disabled{opacity:.32;cursor:default}
.periodo{font-size:15px;font-weight:600;color:var(--muted);margin:22px 2px 10px}
.horas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hora{border-radius:12px;padding:12px 0;font-size:16px;font-weight:500;background:#fff;text-align:center;transition:background .2s var(--ease),color .2s var(--ease)}
.hora.on{background:var(--black);color:#fff}

/* Resumo e formulário */
.linha{display:flex;justify-content:space-between;gap:16px;padding:13px 18px;font-size:16px;position:relative}
.linha+.linha::before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:var(--hair)}
.linha span:first-child{color:var(--muted)}
.linha span:last-child{text-align:right}
.linha.total span{color:var(--ink);font-weight:600}
.form{margin-top:26px}
.campo{margin-bottom:12px}
.campo label{display:block;font-size:14px;color:var(--muted);margin:0 4px 6px}
.campo input{width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:17px;background:#fff;box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .2s var(--ease)}
.campo input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold)}
.nota{font-size:14px;color:var(--muted);margin:16px 4px 0;line-height:1.5}
.erro{color:var(--erro);font-size:15px;margin:12px 4px 0;min-height:1em}

/* Barra inferior */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -1px 0 var(--hair);padding:12px 20px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .45s var(--ease)}
.barra.on{transform:none}
.barra .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:16px}
.barra .res{flex:1;min-width:0;font-size:14px;color:var(--muted);line-height:1.35}
.barra .res b{display:block;color:var(--ink);font-size:17px;font-weight:600}
.btn{background:var(--black);color:#fff;font-weight:500;border-radius:99px;padding:13px 26px;font-size:17px;white-space:nowrap;text-align:center;transition:background .2s var(--ease),opacity .2s var(--ease),transform .1s}
.btn:hover{background:#1E120A}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default;transform:none}
.btn.link{background:none;color:var(--gold);padding:10px}

/* Sucesso */
.ok{text-align:center;padding:30px 0 0}
.ok svg{width:84px;height:84px;margin:0 auto 22px;display:block}
.ok circle{stroke:var(--gold-light);stroke-width:2;fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:traco .7s var(--ease) forwards}
.ok path{stroke:var(--gold);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:traco .45s var(--ease) .55s forwards}
@keyframes traco{to{stroke-dashoffset:0}}
.ok h2{margin-bottom:10px}
.ok p{color:var(--muted);max-width:34ch;margin:0 auto 8px}
.cod{font-size:15px;color:var(--faint);margin:14px 0 28px}
.cod b{color:var(--ink);font-weight:600;letter-spacing:.04em}
.acoes{display:grid;gap:6px;max-width:320px;margin:0 auto}
.acoes .btn{text-decoration:none;display:block}

/* Carregando */
.esq{height:62px;background:#fff;position:relative;overflow:hidden}
.esq:first-child{border-radius:18px 18px 0 0}.esq:last-child{border-radius:0 0 18px 18px}
.esq::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.035),transparent);animation:varre 1.2s infinite}
@keyframes varre{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

footer{text-align:center;color:var(--faint);font-size:13px;margin-top:40px}

/* Transições entre passos */
.vai{animation:vai .5s var(--ease)}.volta{animation:volta .5s var(--ease)}.entra{animation:entra .6s var(--ease)}
@keyframes vai{from{opacity:0;transform:translateX(36px)}}
@keyframes volta{from{opacity:0;transform:translateX(-36px)}}
@keyframes entra{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){.hero h1{font-size:72px}.palco{width:400px}.hero p{font-size:21px}h2{font-size:40px}.horas{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header class="hero">
  <div class="palco" id="palco"><div class="marca"><img src="logo.png" alt="Guria Dourada Beauty Clinic" width="560" height="369"></div></div>
  <h1>Agende seu horário</h1>
  <p>Escolha o serviço, a profissional e o melhor momento em poucos toques.</p>
  <div class="ctas"><button class="btn ouro" id="cta">Agendar agora</button><div class="horario" id="horario"></div></div>
</header>

<main class="wrap" id="agenda">
  <div id="app" aria-live="polite"><div class="lista" style="margin-top:20px"><div class="esq"></div><div class="esq"></div><div class="esq"></div><div class="esq"></div></div></div>
  <footer>Guria Dourada Beauty Clinic</footer>
</main>

<div class="barra" id="barra"><div class="in"><div class="res" id="barraRes"></div><button class="btn" id="barraBtn">Continuar</button></div></div>

<script>
const URL_SB = 'https://tfoazcjbnubedrwndqtc.supabase.co';
const KEY_SB = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmb2F6Y2pibnViZWRyd25kcXRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjA4MjMsImV4cCI6MjEwNTU5NjgyM30.B_00xsYqcW5r27Uo5ZpUec3Mb6ZVCnNztvsGOBLzW20';

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoje = () => iso(new Date());
const addDias = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const toMin = h => { const [a, b] = String(h).split(':').map(Number); return a * 60 + b; };
const toHM = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const brl = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dur = m => m < 60 ? `${m} min` : m % 60 ? `${Math.floor(m / 60)} h ${pad(m % 60)}` : `${m / 60} h`;
const SEM = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const SEM_LONGO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const MES_LONGO = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const DIAS_AGENDA = 60;
const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* Nome do serviço padronizado: sem emoji, sem caixa alta, "Pacote" vira etiqueta */
const MINUSC = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'com', 'sem', 'para', 'a', 'o', 'em']);
function limparNome(nome) {
  let s = String(nome).replace(/\p{Extended_Pictographic}|️/gu, '').replace(/\s*\/\s*/g, ' / ')
    .replace(/\(\s*/g, '(').replace(/\s*\)/g, ')').replace(/\s*-\s*/g, ', ').replace(/\s+/g, ' ').trim();
  const pacote = /pacote/i.test(s);
  s = s.replace(/\s*,?\s*pacote\s*$/i, '').replace(/^\s*pacote\s*,?\s*/i, '');
  s = s.toLowerCase().split(' ').map((w, i) => (i && MINUSC.has(w)) ? w : w.replace(/^(\(?)(\p{L})/u, (m, p, l) => p + l.toUpperCase())).join(' ');
  return { nome: s.replace(/\s*,\s*$/, ''), pacote };
}
function categoria(nome) {
  const n = nome.toLowerCase();
  if (/mega ?hair/.test(n)) return 'Mega Hair';
  if (/corte/.test(n)) return 'Cortes';
  if (/escova/.test(n)) return 'Escovas';
  if (/progressiv|alisa|botox/.test(n)) return 'Progressiva e Botox';
  if (/colora|mecha|luzes|balayage|tint/.test(n)) return 'Coloração';
  if (/bronze|drenagem|massag|depila/.test(n)) return 'Corpo e Bronze';
  if (/manicure|pedicure|unha/.test(n)) return 'Unhas';
  if (/sobrancelha|c[ií]lio/.test(n)) return 'Sobrancelha e Cílios';
  return 'Tratamentos';
}
const ORDEM_CATS = ['Escovas', 'Cortes', 'Tratamentos', 'Progressiva e Botox', 'Coloração', 'Mega Hair', 'Corpo e Bronze', 'Unhas', 'Sobrancelha e Cílios'];

/* ============ Estado ============ */
let sb, cfg = {}, profs = [], servicos = [], ocupados = [];
const sel = { servs: [], prof: null, data: null, hora: null };
const form = { nome: '', tel: '', niver: '' };
let dir = 'entra', passo = 1, catAtiva = 'Todos', busca = '';
const app = $('#app'), barra = $('#barra');

/* ============ Dados ============ */
async function iniciar() {
  if (!window.supabase) return falha('A página não carregou por completo. Confira a internet e recarregue.');
  sb = window.supabase.createClient(URL_SB, KEY_SB, { auth: { persistSession: false } });
  const { data, error } = await sb.rpc('agenda_publica');
  if (error || !data) return falha('Sem conexão com a agenda. Confira a internet e recarregue a página.');
  cfg = data.config || {};
  profs = (data.profs || []).sort((a, b) => (a.cadeira || 0) - (b.cadeira || 0));
  ocupados = data.ocupados || [];
  const vistos = new Set();
  servicos = (data.servicos || []).map(s => {
    const l = limparNome(s.nome);
    return { id: s.id, nome: l.nome, pacote: l.pacote, preco: +s.preco || 0, dur: +s.dur || 60, cat: s.cat || categoria(s.nome) };
  }).filter(s => { const k = s.nome.toLowerCase() + '|' + s.preco; if (vistos.has(k)) return false; vistos.add(k); return true; })
    .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  if (cfg.abre && cfg.fecha) $('#horario').textContent = `Aberto das ${cfg.abre.replace(':00', 'h')} às ${cfg.fecha.replace(':00', 'h')}`;
  if (!servicos.length || !profs.length) return falha('A agenda está sendo atualizada. Volte em alguns minutos.');
  render();
}
function falha(msg) { app.innerHTML = `<div class="vazio">${esc(msg)}<br><br><button class="btn" onclick="location.reload()">Recarregar</button></div>`; barra.classList.remove('on'); }

const durTotal = () => sel.servs.reduce((t, s) => t + s.dur, 0) || 60;
const precoTotal = () => sel.servs.reduce((t, s) => t + s.preco, 0);
const temAvaliacao = () => sel.servs.some(s => !s.preco);
const fechado = data => (cfg.fechado || []).includes(new Date(data + 'T12:00').getDay());

function livres(data, profId, d) {
  if (!cfg.abre || !cfg.fecha || fechado(data)) return [];
  const ini = toMin(cfg.abre), fim = toMin(cfg.fecha), p = +(cfg.intervalo || 30);
  const agora = new Date(), minAgora = data === hoje() ? agora.getHours() * 60 + agora.getMinutes() + 30 : -1;
  const oc = ocupados.filter(a => a.data === data && a.prof === profId);
  const out = [];
  for (let m = ini; m + d <= fim; m += p) {
    if (m <= minAgora) continue;
    if (!oc.some(a => m < toMin(a.hora) + (+a.dur || 60) && toMin(a.hora) < m + d)) out.push(m);
  }
  return out;
}
function horariosDoDia(data) {
  const d = durTotal(), ids = sel.prof ? [sel.prof.id] : profs.map(p => p.id), todos = new Set();
  ids.forEach(id => livres(data, id, d).forEach(m => todos.add(m)));
  return [...todos].sort((a, b) => a - b);
}

/* ============ Telas ============ */
const NOMES = ['Serviços', 'Profissional', 'Data e horário', 'Seus dados'];
function cabecalho(titulo, sub) {
  return `<div class="topo">${passo > 1 ? `<button class="voltar" id="voltar"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>${NOMES[passo - 2]}</button>` : '<span></span>'}
    <span class="passo">Passo ${passo} de 4</span></div>
    <div class="trilho">${NOMES.map((_, i) => `<i class="${i < passo ? 'on' : ''}"></i>`).join('')}</div>
    <h2>${titulo}</h2><p class="sub">${sub}</p>`;
}
function render() {
  document.body.classList.toggle('compacto', passo > 1);
  ({ 1: telaServicos, 2: telaProf, 3: telaData, 4: telaDados })[passo]();
  app.classList.remove('entra', 'vai', 'volta'); void app.offsetWidth; app.classList.add(dir);
  const v = $('#voltar'); if (v) v.onclick = () => ir(passo - 1);
  atualizarBarra();
}
function ir(p) { dir = p > passo ? 'vai' : 'volta'; passo = p; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function telaServicos() {
  const cats = ORDEM_CATS.filter(c => servicos.some(s => s.cat === c)).concat([...new Set(servicos.map(s => s.cat))].filter(c => !ORDEM_CATS.includes(c)));
  const norm = t => t.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const q = norm(busca.trim());
  const lista = servicos.filter(s => (catAtiva === 'Todos' || s.cat === catAtiva) && (!q || norm(s.nome).includes(q)));
  const item = s => { const on = sel.servs.some(x => x.id === s.id);
    return `<button class="item ${on ? 'on' : ''}" data-s="${s.id}" aria-pressed="${on}"><span class="txt"><b>${esc(s.nome)}</b>
      <span class="meta"><span class="preco">${s.preco ? brl(s.preco) : 'Sob avaliação'}</span><span>${dur(s.dur)}</span>${s.pacote ? '<span class="pacote">Pacote</span>' : ''}</span></span>${CHECK}</button>`; };
  let corpo;
  if (!lista.length) corpo = '<div class="vazio">Nenhum serviço com esse nome. Tente outra palavra.</div>';
  else if (catAtiva === 'Todos' && !q) corpo = cats.map(c => `<h3 class="titulo-grupo">${esc(c)}</h3><div class="lista">${lista.filter(s => s.cat === c).map(item).join('')}</div>`).join('');
  else corpo = `<div class="lista" style="margin-top:14px">${lista.map(item).join('')}</div>`;
  app.innerHTML = cabecalho('Escolha os serviços.', 'Pode escolher mais de um.') +
    `<div class="busca"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
     <input id="busca" type="search" placeholder="Buscar" value="${esc(busca)}" autocomplete="off"></div>
     <div class="filtros">${['Todos', ...cats].map(c => `<button class="filtro ${c === catAtiva ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
     ${corpo}`;
  const inp = $('#busca');
  inp.oninput = () => { busca = inp.value; const pos = inp.selectionStart; telaServicos(); atualizarBarra(); const n = $('#busca'); n.focus(); n.setSelectionRange(pos, pos); };
  app.querySelectorAll('.filtro').forEach(b => b.onclick = () => { catAtiva = b.dataset.c; telaServicos(); atualizarBarra(); app.querySelector('.filtro.on')?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); });
  app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    const s = servicos.find(x => x.id === b.dataset.s), i = sel.servs.findIndex(x => x.id === s.id);
    if (i >= 0) sel.servs.splice(i, 1); else sel.servs.push(s);
    sel.data = sel.hora = null;
    b.classList.toggle('on', i < 0); b.setAttribute('aria-pressed', i < 0);
    atualizarBarra();
  });
}

function telaProf() {
  app.innerHTML = cabecalho('Com quem você prefere?', 'Ou deixe com a gente e veja mais horários.') +
    `<div class="lista"><button class="item ${!sel.prof ? 'on' : ''}" data-p=""><span class="txt"><b>Primeira disponível</b><span class="desc">Mais opções de horário</span></span>${CHECK}</button>
    ${profs.map(p => `<button class="item ${sel.prof?.id === p.id ? 'on' : ''}" data-p="${p.id}"><span class="txt"><b>${esc(p.nome)}</b></span>${CHECK}</button>`).join('')}</div>`;
  app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    sel.prof = b.dataset.p ? profs.find(p => p.id === b.dataset.p) : null; sel.data = sel.hora = null;
    app.querySelectorAll('.item').forEach(x => x.classList.toggle('on', x === b));
    atualizarBarra();
  });
}

function telaData() {
  const dias = []; for (let i = 0; i <= DIAS_AGENDA; i++) { const d = addDias(hoje(), i); dias.push({ d, n: horariosDoDia(d).length }); }
  if (!sel.data || !dias.find(x => x.d === sel.data && x.n)) { sel.data = dias.find(x => x.n)?.d || null; sel.hora = null; }
  const dt = sel.data ? new Date(sel.data + 'T12:00') : null;
  const hs = sel.data ? horariosDoDia(sel.data) : [];
  const grupos = [['Manhã', m => m < 720], ['Tarde', m => m >= 720 && m < 1080], ['Noite', m => m >= 1080]];
  const blocos = grupos.map(([nome, f]) => { const l = hs.filter(f); return l.length ? `<div class="periodo">${nome}</div><div class="horas">${l.map(m => `<button class="hora ${toHM(m) === sel.hora ? 'on' : ''}" data-h="${toHM(m)}">${toHM(m)}</button>`).join('')}</div>` : ''; }).join('');
  app.innerHTML = cabecalho('Quando fica melhor?', `${dur(durTotal())} de atendimento${sel.prof ? ' com ' + esc(sel.prof.nome) : ''}.`) +
    (sel.data ? `<div class="mes">${MES_LONGO[dt.getMonth()]} de ${dt.getFullYear()}</div>
    <div class="dias">${dias.map(x => { const d = new Date(x.d + 'T12:00');
      return `<button class="dia ${x.d === sel.data ? 'on' : ''}" data-d="${x.d}" ${x.n ? '' : 'disabled'} aria-label="${SEM_LONGO[d.getDay()]}, ${d.getDate()}"><span>${x.d === hoje() ? 'Hoje' : SEM[d.getDay()]}</span><b>${d.getDate()}</b></button>`; }).join('')}</div>
    ${blocos || '<div class="vazio">Sem horários neste dia.</div>'}`
    : '<div class="vazio">Sem horários livres nos próximos 60 dias para essa escolha. Tente outra profissional ou menos serviços.</div>');
  const on = app.querySelector('.dia.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  app.querySelectorAll('.dia').forEach(b => b.onclick = () => { sel.data = b.dataset.d; sel.hora = null; const y = window.scrollY, x = app.querySelector('.dias').scrollLeft; telaData(); app.querySelector('.dias').scrollLeft = x; atualizarBarra(); window.scrollTo(0, y); });
  app.querySelectorAll('.hora').forEach(b => b.onclick = () => { sel.hora = b.dataset.h; app.querySelectorAll('.hora').forEach(x => x.classList.toggle('on', x === b)); atualizarBarra(); });
}

function quando() { const d = new Date(sel.data + 'T12:00'); return `${SEM_LONGO[d.getDay()]}, ${d.getDate()} de ${MES_LONGO[d.getMonth()].toLowerCase()}, às ${sel.hora}`; }
function totalTxt() { return precoTotal() ? brl(precoTotal()) + (temAvaliacao() ? ' + avaliação' : '') : 'Sob avaliação'; }
function mascaraTel(v) { const d = v.replace(/\D/g, '').slice(0, 11); if (d.length <= 2) return d.length ? `(${d}` : ''; if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`; if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; }

function telaDados() {
  app.innerHTML = cabecalho('Confira e finalize.', 'Confirmamos pelo WhatsApp.') +
    `<div class="lista">${sel.servs.map(s => `<div class="linha"><span>${esc(s.nome)}</span><span>${s.preco ? brl(s.preco) : 'Avaliação'}</span></div>`).join('')}
      <div class="linha"><span>Profissional</span><span>${esc(sel.prof?.nome || 'Primeira disponível')}</span></div>
      <div class="linha"><span>Quando</span><span>${quando()}</span></div>
      <div class="linha"><span>Duração</span><span>${dur(durTotal())}</span></div>
      <div class="linha total"><span>Total</span><span>${totalTxt()}</span></div></div>
    <div class="form">
      <div class="campo"><label for="fNome">Nome completo</label><input id="fNome" value="${esc(form.nome)}" autocomplete="name"></div>
      <div class="campo"><label for="fTel">WhatsApp</label><input id="fTel" value="${esc(form.tel)}" placeholder="(51) 99999-9999" type="tel" inputmode="numeric" autocomplete="tel-national"></div>
      <div class="campo"><label for="fNiver">Aniversário, opcional. Tem presente no seu mês.</label><input id="fNiver" value="${esc(form.niver)}" type="date"></div>
    </div>
    <p class="nota">O horário fica reservado depois que confirmamos pelo WhatsApp.</p>
    <div class="erro" id="err"></div>`;
  const n = $('#fNome'), t = $('#fTel'), b = $('#fNiver');
  n.oninput = () => { form.nome = n.value; atualizarBarra(); };
  t.oninput = () => { t.value = mascaraTel(t.value); form.tel = t.value; atualizarBarra(); };
  b.oninput = () => { form.niver = b.value; };
}

/* ============ Barra inferior ============ */
function podeAvancar() {
  if (passo === 1) return sel.servs.length > 0;
  if (passo === 2) return true;
  if (passo === 3) return !!(sel.data && sel.hora);
  return form.nome.trim().length >= 2 && form.tel.replace(/\D/g, '').length >= 10;
}
function atualizarBarra() {
  const n = sel.servs.length;
  barra.classList.toggle('on', n > 0);
  $('#barraRes').innerHTML = n ? `<b>${totalTxt()}</b>${n} serviço${n > 1 ? 's' : ''}, ${dur(durTotal())}${passo === 3 && sel.hora ? `, ${sel.data.slice(8)}/${sel.data.slice(5, 7)} às ${sel.hora}` : ''}` : '';
  const btn = $('#barraBtn');
  btn.textContent = passo === 4 ? 'Pedir horário' : 'Continuar';
  btn.disabled = !podeAvancar();
}
$('#barraBtn').onclick = () => { if (!podeAvancar()) return; if (passo < 4) ir(passo + 1); else enviar(); };

/* ============ Envio ============ */
async function enviar() {
  const btn = $('#barraBtn'), err = $('#err');
  btn.disabled = true; btn.textContent = 'Enviando...'; err.textContent = '';
  const { data: agId, error } = await sb.rpc('solicitar_agendamento', {
    p_nome: form.nome.trim(), p_tel: form.tel.trim(), p_niver: form.niver || '', p_data: sel.data, p_hora: sel.hora,
    p_prof: sel.prof?.id || null, p_servs: sel.servs.map(s => s.id)
  });
  if (error) {
    err.textContent = error.message && !/fetch|network/i.test(error.message) ? error.message : 'Sem conexão. Confira a internet e toque em Pedir horário de novo.';
    if (/preenchido/.test(error.message || '')) { const r = await sb.rpc('agenda_publica'); if (r.data) ocupados = r.data.ocupados || []; }
    atualizarBarra(); return;
  }
  sucesso(agId);
}
function linkAgenda() {
  const ini = sel.data.replace(/-/g, '') + 'T' + sel.hora.replace(':', '') + '00';
  const fim = sel.data.replace(/-/g, '') + 'T' + toHM(toMin(sel.hora) + durTotal()).replace(':', '') + '00';
  const p = new URLSearchParams({ action: 'TEMPLATE', text: 'Guria Dourada Beauty Clinic', dates: `${ini}/${fim}`, ctz: 'America/Sao_Paulo',
    details: 'Pedido de horário: ' + sel.servs.map(s => s.nome).join(', ') + '. Aguardando confirmação pelo WhatsApp.' });
  return 'https://calendar.google.com/calendar/render?' + p;
}
function sucesso(agId) {
  barra.classList.remove('on');
  app.classList.remove('vai', 'volta'); void app.offsetWidth; app.classList.add('entra');
  app.innerHTML = `<div class="ok"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40" pathLength="1"/><path d="M26 43l11 11 21-23" pathLength="1"/></svg>
    <h2>Pedido enviado.</h2>
    <p>${quando()}.</p><p>Vamos confirmar pelo WhatsApp ${esc(form.tel)}.</p>
    <div class="cod">Código do pedido <b>GD-${esc(String(agId || '').toUpperCase().slice(0, 6))}</b></div>
    <div class="acoes"><a class="btn" href="${linkAgenda()}" target="_blank" rel="noopener">Salvar na minha agenda</a>
    <button class="btn link" onclick="location.reload()">Fazer outro pedido</button></div></div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Topo: botão e efeito ao rolar */
$('#cta').onclick = () => $('#agenda').scrollIntoView({ behavior: 'smooth' });
const palco = $('#palco'), calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tickRolagem = false;
addEventListener('scroll', () => {
  if (calmo || tickRolagem || document.body.classList.contains('compacto')) return;
  tickRolagem = true;
  requestAnimationFrame(() => {
    const y = Math.min(scrollY, 600), k = y / 600;
    palco.style.transform = `translateY(${y * 0.35}px) scale(${1 - k * 0.12})`;
    palco.style.opacity = String(1 - k * 0.9);
    tickRolagem = false;
  });
}, { passive: true });

iniciar();
</script>
</body>
</html>
